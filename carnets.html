<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d1f3b"><title>ASISTENCIA-QR SJB · Carnés v14.34</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#172033;background:#eef2f6}*{box-sizing:border-box}body{margin:0}
header{padding:18px;background:linear-gradient(135deg,#6d1f3b,#243f68);color:#fff}main{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
input,select,button,a.btn{font:inherit;border-radius:10px;padding:10px}input,select{border:1px solid #cbd5e1;background:#fff}
button,a.btn{border:0;background:#243f68;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.alt{background:#6d1f3b}.soft{background:#e8edf5;color:#172033}.danger{background:#991b1b}
.tag{display:inline-block;padding:6px 9px;border-radius:999px;font-weight:800;font-size:.85rem}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}
.student{border:1px solid #e2e8f0;border-radius:13px;padding:12px;background:#f8fafc}.photo{width:72px;height:72px;border-radius:12px;background:#e5e7eb;object-fit:cover}
.muted{color:#64748b}.hidden{display:none!important}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.print-card{background:#fff;border:2px solid #6d1f3b;border-radius:16px;padding:14px;text-align:center;page-break-inside:avoid}.print-card .brand{font-weight:900;color:#6d1f3b}
.print-card canvas{margin:10px auto}.print-card .name{font-size:1.05rem;font-weight:900}.print-card .small{font-size:.86rem;color:#475569}
@media print{body{background:#fff}header,.no-print,#searchCard,#resultsCard{display:none!important}main{max-width:none;padding:0}.card{box-shadow:none;border:0}.cards{grid-template-columns:repeat(2,1fr);gap:10mm}.print-card{height:82mm;padding:8mm}}
</style></head><body>
<header><b>ASISTENCIA-QR SJB</b><div>Carnés / Emisión QR · v14.34 · RESTORE TEST</div></header>
<main>
<div class="card no-print"><h3>1 · Sesión</h3><div class="row"><input id="email" type="email" value="imagen.institucional@cegnesanjuanbautista.edu.pe"><input id="password" type="password" placeholder="Contraseña"><button id="login">INGRESAR</button><button id="logout" class="soft">CERRAR SESIÓN</button></div><p id="auth" class="muted"></p></div>
<div class="card hidden no-print" id="searchCard"><h3>2 · Buscar / seleccionar</h3>
<div class="row"><input id="q" placeholder="Nombre o código del estudiante"><select id="level"><option value="">Todos los niveles</option><option>Inicial</option><option>Primaria</option><option>Secundaria</option></select><input id="grade" placeholder="Grado, ej. 3° Primaria"><input id="section" placeholder="Sección, ej. A"><button id="search">BUSCAR</button></div>
<div class="row"><button id="selectAll" class="soft">SELECCIONAR RESULTADOS</button><button id="issueSelected" class="alt">EMITIR / REEMITIR SELECCIONADOS</button></div>
<p class="muted">La fotografía se usa solo para identificar al estudiante dentro del sistema. No se imprime en el carné.</p></div>
<div class="card hidden no-print" id="resultsCard"><h3>3 · Estudiantes</h3><p id="summary" class="muted"></p><div id="results" class="grid"></div></div>
<div class="card hidden" id="previewCard"><div class="row no-print"><h3 style="margin-right:auto">4 · Vista previa</h3><button id="print" class="alt">IMPRIMIR / PDF</button><button id="clearPreview" class="soft">LIMPIAR</button></div><div id="cards" class="cards"></div></div>
<div class="card no-print"><div class="row"><a class="btn" href="./">LECTOR QR</a><a class="btn" href="./avisos.html?v=14.34">AVISOS</a><a class="btn" href="./rondas.html?v=14.34">RONDAS</a></div><pre id="diag"></pre></div>
</main>
<script>
const PROJECT_URL='https://tqzmggopevyzxgxijgzi.supabase.co',KEY='sb_publishable_uUlMuJ7qEFXBKWBCeTju8A_f4aSzesa',$=id=>document.getElementById(id);
const state={access:localStorage.getItem('sjb_access')||'',refresh:localStorage.getItem('sjb_refresh')||'',expires:Number(localStorage.getItem('sjb_expires')||0),students:[],selected:new Set()};
function save(d){state.access=d.access_token||'';state.refresh=d.refresh_token||state.refresh;state.expires=Date.now()+((d.expires_in||3600)*1000);localStorage.setItem('sjb_access',state.access);localStorage.setItem('sjb_refresh',state.refresh);localStorage.setItem('sjb_expires',String(state.expires))}
function clear(){['sjb_access','sjb_refresh','sjb_expires'].forEach(k=>localStorage.removeItem(k));state.access='';state.refresh='';state.expires=0}
async function parse(r){const t=await r.text();let d={};try{d=JSON.parse(t)}catch{d={raw:t}}if(!r.ok)throw new Error(d.message||d.error||d.raw||('HTTP '+r.status));return d}
async function refresh(){if(state.access&&Date.now()<state.expires-60000)return true;if(!state.refresh)return false;try{const d=await parse(await fetch(PROJECT_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.refresh})}));save(d);return true}catch{return false}}
async function rpc(name,body={}){if(!(await refresh()))throw new Error('SESIÓN_REQUERIDA');return parse(await fetch(PROJECT_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+state.access,'Content-Type':'application/json'},body:JSON.stringify(body)}))}
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
async function loadPhoto(img,path){if(!path)return;try{const r=await fetch(PROJECT_URL+'/storage/v1/object/authenticated/profile-photos/'+path.replace(/^\/+/,''),{headers:{apikey:KEY,Authorization:'Bearer '+state.access}});if(!r.ok)return;img.src=URL.createObjectURL(await r.blob())}catch{}}
async function searchStudents(){try{const r=await rpc('attendance_qr_students',{p_query:$('q').value.trim()||null,p_level:$('level').value||null,p_grade:$('grade').value.trim()||null,p_section:$('section').value.trim()||null,p_limit:500});state.students=r.students||[];renderStudents()}catch(e){$('diag').textContent=e.message}}
function renderStudents(){state.selected.clear();$('summary').textContent=state.students.length+' estudiante(s)';$('resultsCard').classList.remove('hidden');$('results').innerHTML=state.students.map(s=>`<div class="student" data-id="${esc(s.student_id)}"><div class="row"><img class="photo" data-photo="${esc(s.photo_path||'')}" alt=""><div><b>${esc(s.student_name)}</b><div class="muted">${esc(s.grade_name)} ${esc(s.section_name)} · ${esc(s.campus_name)}</div><span class="tag ${s.qr_active?'green':'yellow'}">${s.qr_active?'QR ACTIVO V'+(s.qr_version||''):'SIN QR ACTIVO'}</span></div></div><div class="row" style="margin-top:9px"><label><input type="checkbox" class="sel"> Seleccionar</label><button class="issue alt">${s.qr_active?'REEMITIR':'EMITIR'}</button><button class="reprint soft" ${s.qr_active?'':'disabled'}>REIMPRIMIR</button><button class="revoke danger" ${s.qr_active?'':'disabled'}>ANULAR</button></div></div>`).join('');
 document.querySelectorAll('.student').forEach(card=>{const id=card.dataset.id,student=state.students.find(x=>x.student_id===id);const img=card.querySelector('img');loadPhoto(img,student?.photo_path);
  card.querySelector('.sel').onchange=e=>e.target.checked?state.selected.add(id):state.selected.delete(id);
  card.querySelector('.issue').onclick=()=>issueOne(id);
  card.querySelector('.reprint').onclick=()=>reprintOne(id);
  card.querySelector('.revoke').onclick=()=>revokeOne(id);
 })}
async function issueOne(id){if(!confirm('Se generará un QR nuevo y el anterior quedará inválido. ¿Continuar?'))return;try{const p=await rpc('attendance_qr_issue',{p_student_id:id});await addCard(p);await searchStudents()}catch(e){alert('No se pudo emitir: '+e.message)}}
async function reprintOne(id){try{const p=await rpc('attendance_qr_print_payload',{p_student_id:id});await addCard(p)}catch(e){if(String(e.message).includes('LEGACY_QR_REISSUE_REQUIRED'))alert('Este QR pertenece al sistema anterior. Para poder imprimirlo desde aquí debes usar REEMITIR una sola vez.');else alert('No se pudo reimprimir: '+e.message)}}
async function revokeOne(id){if(!confirm('¿Anular el QR activo de este estudiante?'))return;try{await rpc('attendance_qr_revoke',{p_student_id:id});await searchStudents();alert('QR anulado correctamente.')}catch(e){alert(e.message)}}
async function addCard(p){$('previewCard').classList.remove('hidden');const d=document.createElement('div');d.className='print-card';d.innerHTML=`<div class="brand">CEGNE SAN JUAN BAUTISTA</div><div>CARNÉ DE ASISTENCIA</div><div class="name">${esc(p.student_name)}</div><div class="small">${esc((p.grade_name||'')+' '+(p.section_name||''))}</div><div class="qr"></div><div class="small">Código: ${esc(p.student_code||'—')} · QR v${esc(p.version||'')}</div><div class="small">Somos parte de la excelencia</div><div class="small">Uso exclusivo para registro de asistencia</div>`; $('cards').appendChild(d);try{await QRCode.toCanvas(document.createElement('canvas'),p.qr_token,{width:190,margin:1}).then(c=>d.querySelector('.qr').appendChild(c))}catch(e){d.querySelector('.qr').textContent='No se pudo dibujar QR'}}
async function issueSelected(){const ids=[...state.selected];if(!ids.length){alert('Selecciona al menos un estudiante.');return}if(!confirm('Se emitirán QR nuevos para '+ids.length+' estudiante(s). Los QR anteriores quedarán inválidos.'))return;for(const id of ids){try{const p=await rpc('attendance_qr_issue',{p_student_id:id});const s=state.students.find(x=>x.student_id===id);Object.assign(p,{grade_name:s?.grade_name,section_name:s?.section_name,campus_name:s?.campus_name});await addCard(p)}catch(e){$('diag').textContent+='\n'+id+': '+e.message}}await searchStudents()}
$('login').onclick=async()=>{try{const d=await parse(await fetch(PROJECT_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}));save(d);$('password').value='';$('auth').textContent='Sesión activa';$('searchCard').classList.remove('hidden')}catch(e){$('auth').textContent=e.message}};
$('logout').onclick=()=>{clear();location.reload()};$('search').onclick=searchStudents;$('selectAll').onclick=()=>{document.querySelectorAll('.sel').forEach(x=>{x.checked=true;state.selected.add(x.closest('.student').dataset.id)})};$('issueSelected').onclick=issueSelected;$('print').onclick=()=>window.print();$('clearPreview').onclick=()=>{$('cards').innerHTML='';$('previewCard').classList.add('hidden')};
if(state.access||state.refresh){refresh().then(ok=>{if(ok){$('auth').textContent='Sesión activa';$('searchCard').classList.remove('hidden')}})}
</script></body></html>
