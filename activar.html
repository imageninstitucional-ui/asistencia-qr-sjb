<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#6d1f3b">
<title>ASISTENCIA-QR SJB · Activar cuenta</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;background:#eef2f6;color:#172033}*{box-sizing:border-box}
body{margin:0}header{padding:20px;background:linear-gradient(135deg,#6d1f3b,#243f68);color:#fff}
main{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
input,button,a.btn{width:100%;padding:12px;margin:6px 0;border-radius:10px;font:inherit}
input{border:1px solid #cbd5e1}button,a.btn{border:0;background:#243f68;color:#fff;font-weight:800;text-decoration:none;display:block;text-align:center}
.good{background:#dcfce7}.bad{background:#fee2e2}.warn{background:#fef3c7}.muted{color:#64748b}
</style></head>
<body>
<header><b>ASISTENCIA-QR SJB</b><div>Activación de cuenta de Normas y Disciplina</div></header>
<main>
<div id="state" class="card warn"><b>VALIDANDO INVITACIÓN…</b></div>
<div id="form" class="card" style="display:none">
<h2>Crear contraseña</h2>
<p class="muted">Use al menos 10 caracteres. Esta contraseña es personal y no debe compartirse.</p>
<input id="p1" type="password" autocomplete="new-password" placeholder="Nueva contraseña">
<input id="p2" type="password" autocomplete="new-password" placeholder="Repita la contraseña">
<button id="save">GUARDAR Y ACTIVAR ACCESO</button>
</div>
<div id="done" class="card" style="display:none">
<h2>Cuenta lista</h2>
<p>Su acceso a Rondas de Permanencia quedó habilitado.</p>
<a class="btn" href="./rondas.html?v=14.25">ABRIR RONDAS</a>
</div>
</main>
<script>
const PROJECT_URL='https://tqzmggopevyzxgxijgzi.supabase.co';
const KEY='sb_publishable_uUlMuJ7qEFXBKWBCeTju8A_f4aSzesa';
const stateEl=document.getElementById('state'),form=document.getElementById('form'),done=document.getElementById('done');
let accessToken='',refreshToken='';
function show(t,k){stateEl.className='card '+k;stateEl.innerHTML='<b>'+t+'</b>'}
async function parse(r){const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={raw:t}}if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('HTTP '+r.status));return d}
function saveSession(){
 if(!accessToken)return;
 localStorage.setItem('sjb_access',accessToken);
 if(refreshToken)localStorage.setItem('sjb_refresh',refreshToken);
 localStorage.setItem('sjb_expires',String(Date.now()+3600*1000))
}
async function establish(){
 try{
  const qs=new URLSearchParams(location.search),hs=new URLSearchParams(location.hash.replace(/^#/,''));
  const tokenHash=qs.get('token_hash'),type=qs.get('type')||hs.get('type')||'invite';
  if(tokenHash){
   const d=await parse(await fetch(PROJECT_URL+'/auth/v1/verify',{
    method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({type,token_hash:tokenHash})
   }));
   accessToken=d.access_token||d.session?.access_token||'';
   refreshToken=d.refresh_token||d.session?.refresh_token||'';
  }else{
   accessToken=hs.get('access_token')||'';
   refreshToken=hs.get('refresh_token')||'';
  }
  if(!accessToken)throw new Error('El enlace de invitación no contiene una sesión válida.');
  history.replaceState(null,'',location.pathname);
  const u=await parse(await fetch(PROJECT_URL+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+accessToken}}));
  show('INVITACIÓN CONFIRMADA · '+(u.email||'CUENTA INSTITUCIONAL'),'good');
  form.style.display='block'
 }catch(e){show('NO SE PUDO VALIDAR LA INVITACIÓN: '+e.message,'bad')}
}
document.getElementById('save').onclick=async()=>{
 const a=document.getElementById('p1').value,b=document.getElementById('p2').value;
 if(a!==b)return show('Las contraseñas no coinciden.','bad');
 if(a.length<10)return show('La contraseña debe tener al menos 10 caracteres.','bad');
 try{
  document.getElementById('save').disabled=true;show('GUARDANDO CONTRASEÑA…','warn');
  await parse(await fetch(PROJECT_URL+'/auth/v1/user',{
   method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
   body:JSON.stringify({password:a})
  }));
  saveSession();form.style.display='none';done.style.display='block';
  show('CUENTA ACTIVADA CORRECTAMENTE.','good')
 }catch(e){show('NO SE PUDO ACTIVAR: '+e.message,'bad');document.getElementById('save').disabled=false}
};
establish();
</script></body></html>
