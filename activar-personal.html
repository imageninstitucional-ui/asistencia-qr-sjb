<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#6d1f3b">
<title>ASISTENCIA-QR SJB · Activación Normas</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;background:#eef2f6;color:#172033}*{box-sizing:border-box}
body{margin:0}header{padding:20px;background:linear-gradient(135deg,#6d1f3b,#243f68);color:#fff}
main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
.person{border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin:10px 0;background:#f8fafc}
button,a.btn{padding:10px 12px;border:0;border-radius:10px;font:inherit;font-weight:800;background:#243f68;color:#fff;text-decoration:none;cursor:pointer}
button:disabled{opacity:.55}.soft{background:#e8edf5;color:#172033}.tag{display:inline-block;padding:6px 9px;border-radius:999px;font-weight:800}
.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.muted{color:#64748b}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head>
<body>
<header><b>ASISTENCIA-QR SJB</b><div>Activación controlada · Normas y Disciplina</div></header>
<main>
<div class="card">
<h2>Estado administrativo</h2>
<div id="state" class="tag yellow">COMPROBANDO AAL2…</div>
<p class="muted">Esta pantalla no crea contraseñas. Envía una invitación al correo institucional seleccionado y enlaza el usuario Auth con su operador de Rondas.</p>
<div class="row"><button id="reload" class="soft">ACTUALIZAR</button><a class="btn" href="./rondas.html?v=14.25">VOLVER A RONDAS</a></div>
</div>
<div class="card"><h2>Personal de Normas</h2><div id="people"></div></div>
<pre id="diag"></pre>
</main>
<script>
const PROJECT_URL='https://tqzmggopevyzxgxijgzi.supabase.co';
const KEY='sb_publishable_uUlMuJ7qEFXBKWBCeTju8A_f4aSzesa';
const FN=PROJECT_URL+'/functions/v1/attendance-operator-activation';
const $=id=>document.getElementById(id);
let access=localStorage.getItem('sjb_access')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function jwtPayload(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const q=p+'='.repeat((4-p.length%4)%4);return JSON.parse(atob(q))}catch{return {}}}
async function call(body){
 const r=await fetch(FN,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={raw:t}}
 if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));return d
}
async function load(){
 try{
  if(!access)throw new Error('Inicie sesión primero EN LA PC desde Rondas.');
  if((jwtPayload(access).aal||'aal1')!=='aal2')throw new Error('Se requiere una sesión administrativa AAL2. Vuelva a Rondas y verifique Google Authenticator.');
  $('state').className='tag yellow';$('state').textContent='CARGANDO…';
  const d=await call({action:'list'});
  $('state').className='tag green';$('state').textContent='ADMINISTRADOR · AAL2';
  const rows=Array.isArray(d.operators)?d.operators:[];
  $('people').innerHTML=rows.map(p=>{
   const active=p.linked&&p.activation_status==='active';
   return '<div class="person"><b>'+esc(p.display_name)+'</b><p>'+esc(p.institutional_email||'SIN CORREO INSTITUCIONAL')+'</p>'+
    '<p class="muted">'+esc((p.campuses||[]).join(' · '))+'</p>'+
    '<span class="tag '+(active?'green':'yellow')+'">'+(active?'ACTIVO':'PENDIENTE')+'</span> '+
    '<button class="invite" data-id="'+esc(p.operator_id)+'" '+(active?'disabled':'')+'>'+(active?'YA ACTIVADO':'ENVIAR INVITACIÓN')+'</button></div>'
  }).join('');
  document.querySelectorAll('.invite').forEach(b=>b.onclick=()=>invite(b.dataset.id,b))
 }catch(e){$('state').className='tag red';$('state').textContent='NO AUTORIZADO';$('diag').textContent=e.message}
}
async function invite(id,btn){
 if(!confirm('¿Enviar ahora la invitación institucional a esta persona? Esta acción puede enviar un correo real.'))return;
 try{
  btn.disabled=true;btn.textContent='ENVIANDO…';
  const d=await call({action:'invite',operator_id:id});
  alert((d.invited?'INVITACIÓN ENVIADA':'USUARIO EXISTENTE ENLAZADO')+'\n'+d.display_name+'\n'+d.email);
  await load()
 }catch(e){alert('No se pudo activar: '+e.message);btn.disabled=false;btn.textContent='ENVIAR INVITACIÓN'}
}
$('reload').onclick=load;load();
</script></body></html>
