<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#6d1f3b">
<title>ASISTENCIA-QR SJB · Nueva contraseña</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;background:#eef2f6;color:#172033}
*{box-sizing:border-box}body{margin:0}header{padding:20px;background:linear-gradient(135deg,#6d1f3b,#243f68);color:white}
main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;font:inherit}input{border:1px solid #cbd5e1}
button{border:0;background:#243f68;color:white;font-weight:800}.good{background:#dcfce7}.bad{background:#fee2e2}.warn{background:#fef3c7}.muted{color:#64748b}
</style>
</head>
<body>
<header><b>ASISTENCIA-QR SJB</b><div>Recuperación de contraseña</div></header>
<main>
<div id="state" class="card warn"><b>VALIDANDO ENLACE DE RECUPERACIÓN…</b></div>
<div id="form" class="card" style="display:none">
<h2>Crear nueva contraseña</h2>
<p class="muted">Use al menos 10 caracteres. No comparta su contraseña.</p>
<input id="p1" type="password" autocomplete="new-password" placeholder="Nueva contraseña">
<input id="p2" type="password" autocomplete="new-password" placeholder="Repita la contraseña">
<button id="save">GUARDAR NUEVA CONTRASEÑA</button>
</div>
<div class="card"><a href="./">Volver al lector ASISTENCIA-QR</a></div>
</main>
<script>
const PROJECT_URL='https://tqzmggopevyzxgxijgzi.supabase.co';
const KEY='sb_publishable_uUlMuJ7qEFXBKWBCeTju8A_f4aSzesa';
const stateEl=document.getElementById('state');
const form=document.getElementById('form');
let accessToken=null;
function show(text,kind){stateEl.className='card '+kind;stateEl.innerHTML='<b>'+text+'</b>'}
async function parse(r){const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={raw:t}}if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('HTTP '+r.status));return d}
async function establish(){
 try{
   const qs=new URLSearchParams(location.search);
   const hs=new URLSearchParams(location.hash.replace(/^#/,''));
   const tokenHash=qs.get('token_hash');
   const type=qs.get('type')||hs.get('type')||'recovery';
   if(tokenHash){
     const d=await parse(await fetch(PROJECT_URL+'/auth/v1/verify',{
       method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
       body:JSON.stringify({type,token_hash:tokenHash})
     }));
     accessToken=d.access_token||d.session?.access_token||null;
   }else{
     accessToken=hs.get('access_token');
   }
   if(!accessToken) throw new Error('El enlace no contiene una sesión de recuperación válida.');
   history.replaceState(null,'',location.pathname);
   show('ENLACE CONFIRMADO. Ahora cree su nueva contraseña.','good');
   form.style.display='block';
 }catch(e){
   show('NO SE PUDO VALIDAR EL ENLACE: '+e.message,'bad');
 }
}
document.getElementById('save').onclick=async()=>{
 const a=document.getElementById('p1').value;
 const b=document.getElementById('p2').value;
 if(a!==b)return show('Las contraseñas no coinciden.','bad');
 if(a.length<10)return show('La contraseña debe tener al menos 10 caracteres.','bad');
 try{
   document.getElementById('save').disabled=true;
   const d=await parse(await fetch(PROJECT_URL+'/auth/v1/user',{
     method:'PUT',
     headers:{apikey:KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
     body:JSON.stringify({password:a})
   }));
   accessToken=null; form.style.display='none';
   show('CONTRASEÑA ACTUALIZADA. Ya puede volver al lector e iniciar sesión.','good');
 }catch(e){
   show('NO SE PUDO ACTUALIZAR: '+e.message,'bad');
   document.getElementById('save').disabled=false;
 }
};
establish();
</script>
</body>
</html>
